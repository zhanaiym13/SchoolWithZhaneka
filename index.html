<!DOCTYPE html>
<html lang="kk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SchoolQuest — Мектепке жолсерік</title>
  <style>
    :root {
      --primary: #0f5c3e;
      --primary-light: #198754;
      --accent: #f59e0b;
      --accent-hover: #d97706;
      --bg: #eef3f0;
      --card: #ffffff;
      --text: #1e293b;
      --muted: #64748b;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; }
    body {
      background-color: var(--bg);
      background-image:
        radial-gradient(circle at 12% 18%, rgba(15, 92, 62, 0.08) 0%, transparent 28%),
        radial-gradient(circle at 88% 78%, rgba(245, 158, 11, 0.09) 0%, transparent 28%);
      color: var(--text);
      min-height: 100vh;
      overflow-x: hidden;
    }
    .bg-decor {
      position: fixed; font-size: 2.3rem; opacity: 0.12; pointer-events: none; z-index: 0;
      animation: float 7s ease-in-out infinite;
    }
    @keyframes float {
      0%, 100% { transform: translateY(0px) rotate(0deg); }
      50% { transform: translateY(-16px) rotate(6deg); }
    }
    .lang-bar {
      display: flex; justify-content: flex-end; gap: 6px;
      max-width: 980px; margin: 0 auto 8px; padding: 0 8px;
    }
    .lang-btn {
      background: rgba(255,255,255,0.2); color: white; border: 1px solid rgba(255,255,255,0.35);
      padding: 4px 10px; border-radius: 8px; font-size: 0.78rem; font-weight: 700; cursor: pointer;
    }
    .lang-btn.active { background: var(--accent); color: #1e293b; border-color: var(--accent); }
    .auth-lang-bar {
      display: flex; justify-content: center; gap: 6px; margin-bottom: 14px;
    }
    .auth-lang-bar .lang-btn {
      background: #f1f5f9; color: var(--text); border-color: #cbd5e1;
    }
    .auth-lang-bar .lang-btn.active {
      background: var(--primary); color: white; border-color: var(--primary);
    }
    header {
      background: linear-gradient(135deg, var(--primary) 0%, #083825 100%);
      color: white; padding: 1rem 1rem 1.6rem; text-align: center;
      position: relative; z-index: 10; box-shadow: 0 4px 20px rgba(0,0,0,0.12);
    }
    header h1 { font-size: 1.9rem; display: flex; align-items: center; justify-content: center; gap: 10px; }
    header p { opacity: 0.9; margin-top: 4px; font-size: 0.92rem; }
    .user-bar {
      max-width: 980px; margin: 12px auto 0; background: rgba(255,255,255,0.14);
      backdrop-filter: blur(8px); padding: 8px 16px; border-radius: 50px;
      display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 10px;
      font-size: 0.88rem;
    }
    .badge-pill { background: rgba(255,255,255,0.22); padding: 4px 12px; border-radius: 20px; font-weight: 600; }
    nav {
      display: flex; justify-content: center; flex-wrap: wrap; gap: 8px; padding: 12px;
      background: rgba(255,255,255,0.88); backdrop-filter: blur(10px);
      position: sticky; top: 0; z-index: 20; border-bottom: 1px solid #e2e8f0;
    }
    nav button {
      background: #e9f2ee; color: var(--primary); border: none; padding: 9px 15px;
      border-radius: 12px; font-weight: 600; cursor: pointer; transition: all 0.2s; font-size: 0.9rem;
    }
    nav button:hover, nav button.active { background: var(--primary); color: white; transform: translateY(-1px); }
    main { max-width: 980px; margin: 22px auto; padding: 0 16px 60px; position: relative; z-index: 5; }
    .section { display: none; animation: fadeIn 0.25s ease; }
    .section.active { display: block; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }
    .card {
      background: var(--card); border-radius: 20px; padding: 22px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.05); margin-bottom: 18px;
      border: 1px solid rgba(15, 92, 62, 0.08);
    }
    #auth-screen { max-width: 440px; margin: 40px auto; position: relative; z-index: 30; }
    .input-group { margin-bottom: 14px; }
    .input-group label { display: block; font-size: 0.85rem; font-weight: 600; margin-bottom: 5px; color: var(--muted); }
    .input-group input, .input-group select {
      width: 100%; padding: 11px 14px; border: 2px solid #e2e8f0; border-radius: 12px;
      font-size: 0.98rem; outline: none; background: white;
    }
    .input-group input:focus, .input-group select:focus { border-color: var(--primary); }
    .btn {
      background: var(--primary); color: white; border: none; padding: 10px 16px;
      border-radius: 12px; font-weight: 600; cursor: pointer; font-size: 0.9rem;
      transition: 0.2s; display: inline-flex; align-items: center; justify-content: center; gap: 6px;
    }
    .btn:hover { background: var(--primary-light); }
    .btn-gold { background: var(--accent); color: #1e293b; }
    .btn-gold:hover { background: var(--accent-hover); color: white; }
    .btn-outline { background: transparent; border: 2px solid var(--primary); color: var(--primary); }
    .btn-outline:hover { background: var(--primary); color: white; }
    .btn-danger { background: #ef4444; color: white; }
    .btn-danger:hover { background: #dc2626; }
    .btn:disabled { opacity: 0.5; cursor: not-allowed; }
    .hero-balance {
      background: linear-gradient(135deg, var(--primary) 0%, #147a52 100%);
      color: white; border-radius: 18px; padding: 24px; text-align: center; margin: 16px 0;
    }
    .hero-balance .stars-count { font-size: 2.4rem; font-weight: 800; }
    .limit-bar-wrap {
      background: rgba(0,0,0,0.25); border-radius: 20px; height: 11px;
      max-width: 340px; margin: 12px auto 6px; overflow: hidden;
    }
    .limit-bar-fill { background: var(--accent); height: 100%; width: 0%; transition: width 0.35s ease; }
    .blueprint-stage {
      background: #0f172a; border-radius: 18px; padding: 18px;
      border: 4px solid #334155; overflow: hidden; position: relative;
    }
    .blueprint-frame {
      position: relative; max-width: 740px; margin: 10px auto; border-radius: 12px;
      overflow: hidden; background: #1e293b; min-height: 340px;
      display: flex; align-items: center; justify-content: center;
      transition: transform 0.75s cubic-bezier(0.22, 1, 0.36, 1);
    }
    .blueprint-frame img { width: 100%; height: auto; max-height: 460px; object-fit: contain; display: block; }
    .room-pin {
      position: absolute; transform: translate(-50%, -50%);
      background: var(--accent); color: #0f172a; font-weight: 800; font-size: 0.78rem;
      padding: 5px 10px; border-radius: 999px; box-shadow: 0 4px 14px rgba(0,0,0,0.45);
      border: 2px solid white; z-index: 6; white-space: nowrap;
    }
    .compass-badge {
      display: inline-flex; align-items: center; gap: 8px; background: #f1f5f9;
      padding: 8px 14px; border-radius: 12px; font-weight: 700; font-size: 0.9rem;
    }
    .info-box {
      background: #f8fafc; border: 1px solid #e2e8f0; border-radius: 14px; padding: 14px; margin-top: 14px;
    }
    .bell-table { width: 100%; border-collapse: collapse; margin-top: 10px; font-size: 0.9rem; }
    .bell-table th, .bell-table td { padding: 9px 10px; border-bottom: 1px solid #e2e8f0; text-align: left; }
    .bell-table th { color: var(--muted); font-size: 0.82rem; }
    .grid-cards {
      display: grid; grid-template-columns: repeat(auto-fill, minmax(270px, 1fr));
      gap: 16px; margin-top: 14px;
    }
    .quest-item, .shop-item {
      border: 1px solid #e2e8f0; border-radius: 16px; padding: 16px; background: #fafafa;
      display: flex; flex-direction: column; justify-content: space-between; gap: 12px;
    }
    .quest-answer-input {
      width: 100%; padding: 9px 12px; border: 2px solid #cbd5e1; border-radius: 10px;
      font-size: 0.9rem; margin-top: 8px; outline: none;
    }
    .quest-answer-input:focus { border-color: var(--primary); }
    .subject-badge {
      display: inline-block; background: #e0f2fe; color: #0369a1;
      font-weight: 700; padding: 3px 9px; border-radius: 8px; font-size: 0.78rem; margin-left: 6px;
    }
    .reward-tag {
      display: inline-block; background: #fef3c7; color: #b45309;
      font-weight: 700; padding: 4px 10px; border-radius: 8px; font-size: 0.85rem;
    }
    .friend-row {
      display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 10px;
      padding: 10px 14px; background: #f8fafc; border: 1px solid #e2e8f0; border-radius: 12px; margin-bottom: 8px;
    }
    #toast {
      position: fixed; bottom: 22px; right: 22px; background: #0f172a; color: white;
      padding: 13px 18px; border-radius: 14px; box-shadow: 0 10px 25px rgba(0,0,0,0.25);
      z-index: 100; transform: translateY(120px); opacity: 0; transition: all 0.3s ease;
      max-width: 350px; font-size: 0.9rem;
    }
    #toast.show { transform: translateY(0); opacity: 1; }
    table { width: 100%; border-collapse: collapse; margin-top: 10px; }
    th, td { padding: 11px; text-align: left; border-bottom: 1px solid #e2e8f0; }
    th { color: var(--muted); font-size: 0.84rem; }
  </style>
</head>

  <div class="bg-decor" style="bottom: 25%; right: 6%; animation-delay: 4s;">🎓</div>
